<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea Luxury</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Welcome to Tea Luxury</h1>
        <nav>
            <ul>
                <li><a href="#products">Products</a></li>
                <li><a href="#cart">Cart</a></li>
                <li><a href="#map">Map</a></li>
                <li><a href="#chat">Chat</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="products">
            <h2>Our Products</h2>
            <div class="product">
                <h3>Green Tea</h3>
                <p>High quality green tea.</p>
            </div>
            <div class="product">
                <h3>Black Tea</h3>
                <p>Rich and full-bodied black tea.</p>
            </div>
            <!-- More products here -->
        </section>
        <section id="cart">
            <h2>Your Cart</h2>
            <p>Your selected items will appear here.</p>
        </section>
        <section id="map">
            <h2>Find Us</h2>
            <div id="map-container">
                <!-- Map will be embedded here -->
            </div>
        </section>
        <section id="chat">
            <h2>Chat with us</h2>
            <div id="chat-container">
                <!-- Chat functionality will be here -->
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Tea Luxury</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
